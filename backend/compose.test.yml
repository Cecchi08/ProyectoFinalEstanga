name: venti-auth-tests
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: venti-local-tests-only
    ports:
      - '127.0.0.1:33316:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pventi-local-tests-only']
      interval: 3s
      timeout: 3s
      retries: 30
